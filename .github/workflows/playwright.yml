name: Playwright CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Environment"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - uat
          - staging
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    environment:
      name: ${{ github.event.inputs.environment || 'qa' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install Allure
        run: npm install -g allure-commandline

      - name: Azure Login
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Azure Playwright Tests
        if: github.ref == 'refs/heads/main'

        env:
          CI: true

          TEST_ENV: ${{ github.event.inputs.environment || 'qa'}}

          RETRIES: 2

          PARALLEL_THREAD: 2

          BASE_URL: ${{ vars.BASE_URL }}

          Timeout: 30000

          USERNAME: ${{ secrets.APP_USERNAME }}

          PASSWORD: ${{ secrets.APP_PASSWORD }}

          PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}

        run: |
          npx playwright test \
          --config=playwright.service.config.ts \
          --workers=2

      - name: Generate Allure Report
        if: github.ref == 'refs/heads/main' && always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && always()
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report/

      - name: Upload Allure Report to Azure Blob
        if: github.ref == 'refs/heads/main' && always()
        run: |
          az storage blob upload-batch \
            --account-name pwrrdaaf6 \
            --destination reports \
            --source allure-report \
            --auth-mode login
